<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Ajouter une Catégorie</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f4f7f6; }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/utilisateurs/principal">⬅️ Retour</a>
        </div>
    </nav>

    <div class="container form-container">
        <div class="card p-4">
            <div class="card-body">
                <h2 class="text-center mb-4 text-secondary">📁 Nouvelle Catégorie</h2>
                <p class="text-center text-muted small">Créez une catégorie pour mieux organiser les outils partagés.</p>
                <hr>
                
                <form th:action="@{/categories/ajouter}" method="post">
                    <div class="mb-3">
                        <label for="nom" class="form-label fw-bold">Nom de la catégorie</label>
                        <input type="text" id="nom" name="nom" class="form-control" placeholder="Ex: Jardinage, Bricolage..." required />
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="4" placeholder="Décrivez brièvement ce que contient cette catégorie..." required></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Enregistrer la catégorie</button>
                        <a href="/utilisateurs/principal" class="btn btn-light">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
