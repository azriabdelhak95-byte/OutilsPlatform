<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier l'outil - OutilsPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/utilisateurs/principal}">🛠️ OutilsPlatform</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <h2 class="mb-4 text-center">Modifier mon outil</h2>
            
            <form th:action="@{/outils/modifier}" th:object="${outil}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nom de l'outil</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Catégorie</label>
                    <select th:field="*{categorie}" class="form-select">
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.id}" 
                                th:text="${cat.nom}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">État</label>
                    <select th:field="*{etat}" class="form-select">
                        <option value="NEUF">Neuf</option>
                        <option value="BON_ETAT">Bon état</option>
                        <option value="USURE_MOYENNE">Usure moyenne</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                    <a th:href="@{/outils/mes-outils}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
