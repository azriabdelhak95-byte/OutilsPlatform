<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Inscription</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            width: 100%;
            max-width: 600px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-label { font-weight: 600; color: #495057; }
        .btn-primary { background-color: #0d6efd; border-radius: 10px; padding: 12px; }
    </style>
</head>
<body>

    <div class="card register-card p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Rejoignez-nous !</h2>
                <p class="text-muted">Créez votre compte pour commencer à partager vos outils.</p>
            </div>

            <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${erreur}">Erreur</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/utilisateurs/inscription}" th:object="${utilisateur}" method="post">
                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="prenom" class="form-label">Prénom</label>
                        <input type="text" id="prenom" th:field="*{prenom}" class="form-control" placeholder="Jean" required />
                    </div>

                    <div class="col-md-6">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control" placeholder="Dupont" required />
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Adresse Email</label>
                        <input type="email" id="email" th:field="*{email}" 
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" 
                               class="form-control" placeholder="jean.dupont@exemple.com" required />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-12">
                        <label for="motDePasse" class="form-label">Mot de Passe</label>
                        <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control" placeholder="********" required />
                    </div>

                    <div class="col-12">
                        <label for="adresse" class="form-label">Adresse complète</label>
                        <input type="text" id="adresse" th:field="*{adresse}" class="form-control" placeholder="123 rue de la Paix, Paris" required />
                    </div>

                    <div class="col-12 d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">🚀 Créer mon compte</button>
                    </div>
                </div>
            </form>

            <div class="mt-4 text-center border-top pt-3">
                <p class="small text-muted">Déjà inscrit ? 
                    <a th:href="@{/utilisateurs/connexion}" class="text-decoration-none fw-bold">Connectez-vous ici</a>
                </p>
                <a th:href="@{/utilisateurs/accueil}" class="btn btn-link btn-sm text-secondary text-decoration-none">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
