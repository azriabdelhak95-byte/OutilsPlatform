<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Liste des Catégories</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; }
        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .thead-dark { background-color: #212529; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-5">
            <a class="navbar-brand" th:href="@{/utilisateurs/principal}">🛠️ OutilsPlatform</a>
            <a th:href="@{/utilisateurs/principal}" class="btn btn-outline-light btn-sm">Accueil</a>
        </div>
    </nav>

    <div class="container">
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-secondary m-0">📁 Liste des Catégories</h2>
                <a th:href="@{/categories/ajouter}" class="btn btn-success shadow-sm">
                    + Ajouter une Catégorie
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" style="width: 25%;">Nom</th>
                            <th scope="col">Description</th>
                            <th scope="col" class="text-center" style="width: 15%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="text-center text-muted py-4">Aucune catégorie trouvée en base de données.</td>
                        </tr>
                        
                        <tr th:each="cat : ${categories}">
                            <td>
                                <span class="fw-bold text-primary" th:text="${cat.nom}">Nom</span>
                            </td>
                            <td>
                                <span class="text-muted" th:text="${cat.description}">Description</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/categories/modifier/{id}(id=${cat.id})}" 
                                       class="btn btn-outline-secondary" title="Modifier">✏️</a>
                                    
                                    <a th:href="@{/categories/supprimer/{id}(id=${cat.id})}" 
                                       class="btn btn-outline-danger" 
                                       title="Supprimer"
                                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette catégorie ?')">🗑️</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
