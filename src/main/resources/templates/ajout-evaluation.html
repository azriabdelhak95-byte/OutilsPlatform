<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Évaluer la transaction</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f4f7f6; }
        .evaluation-card {
            max-width: 600px;
            margin: 50px auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .star-rating {
            color: #ffc107;
            font-size: 1.5rem;
        }
        .btn-submit {
            background: linear-gradient(45deg, #ffc107, #ff9800);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-submit:hover {
            background: linear-gradient(45deg, #ff9800, #e68a00);
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/transactions/mes-transactions">⬅️ Retour aux transactions</a>
        </div>
    </nav>

    <div class="container">
        <div class="card evaluation-card p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="display-3">⭐</span>
                    <h2 class="mt-2">Votre avis compte</h2>
                    <p class="text-muted">Comment s'est passée la transaction pour l'outil : <br>
                        <strong class="text-dark" th:text="${transaction.outil.nom}">Nom de l'outil</strong>
                    </p>
                </div>
                
                <hr>

                <form th:action="@{/evaluations/ajouter}" method="post">
                    <input type="hidden" name="transactionId" th:value="${transaction.id}" />

                    <div class="mb-4 text-center">
                        <label class="form-label d-block fw-bold">Note de l'expérience</label>
                        <div class="d-flex justify-content-center align-items-center gap-3">
                            <span class="text-muted small">Médiocre</span>
                            <input type="range" class="form-range" style="max-width: 200px;" 
                                   name="note" min="1" max="5" step="1" id="noteRange"
                                   oninput="this.nextElementSibling.value = this.value">
                            <output class="badge bg-warning text-dark fs-5">3</output>
                            <span class="text-muted small">Excellent</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="commentaire" class="form-label fw-bold">Votre commentaire</label>
                        <textarea id="commentaire" name="commentaire" class="form-control" 
                                  rows="4" placeholder="Qu'avez-vous pensé de l'outil et de la communication ?" required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-submit btn-lg">Publier mon évaluation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
