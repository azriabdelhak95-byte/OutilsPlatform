<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finaliser la location</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow border-0 mx-auto" style="max-width: 500px; border-radius: 20px;">
            <div class="card-body p-4">
                <h3 class="text-center fw-bold mb-4">Confirmer ma location</h3>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="p-3 bg-primary bg-opacity-10 rounded mb-4 border-start border-primary border-4">
                    <small class="text-uppercase fw-bold text-primary">Outil sélectionné :</small>
                    <h5 class="mb-0 fw-bold" th:text="${outil.nom}">Nom</h5>
                </div>

                <form th:action="@{/transactions/louer}" method="post">
                    <input type="hidden" name="outil_id" th:value="${outil.id}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold">Type de contrat</label>
                        <select name="typeTransaction" class="form-select" required>
                            <option th:each="t : ${typeTransactions}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">Date de début</label>
                            <input type="date" id="dateDebut" name="dateDebut" class="form-control" required />
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">Date de fin</label>
                            <input type="date" id="dateFin" name="dateFin" class="form-control" required />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 rounded-pill shadow-sm">
                        Confirmer la réservation
                    </button>
                    <div class="text-center mt-3">
                        <a th:href="@{/outils/catalogue}" class="text-muted text-decoration-none small">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // On empêche de choisir des dates dans le passé
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateDebut').min = today;
        document.getElementById('dateFin').min = today;
    </script>
</body>
</html>
