<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Mes Locations</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f7f6; padding-top: 80px; }
        .table-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 6px 15px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/utilisateurs/principal}">🛠️ OutilsPlatform</a>
            <div class="ms-auto">
                <a th:href="@{/utilisateurs/principal}" class="btn btn-outline-light btn-sm">Menu Principal</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0">📜 Historique de mes locations</h2>
                <span class="badge bg-secondary" th:text="${#lists.size(transactions)} + ' transaction(s)'">0</span>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}">Réservation réussie !</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${#lists.isEmpty(transactions)}" class="text-center py-5">
                <i class="bi bi-calendar-x text-muted" style="font-size: 3rem;"></i>
                <p class="lead text-muted mt-3">Vous n'avez pas encore effectué de locations.</p>
                <a th:href="@{/outils/catalogue}" class="btn btn-primary rounded-pill px-4">Voir le catalogue</a>
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(transactions)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Outil</th>
                            <th>Date Début</th>
                            <th>Date Fin</th>
                            <th>Type</th>
                            <th class="text-center">Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transactions}">
                            <td class="fw-bold">
                                <i class="bi bi-tools text-primary me-2"></i>
                                <span th:text="${t.outil != null ? t.outil.nom : 'Outil supprimé'}">Nom</span>
                            </td>
                            
                            <td th:text="${t.dateDebut}">--/--/--</td>
                            <td th:text="${t.dateFin}">--/--/--</td>
                            
                            <td>
                                <span class="badge bg-light text-primary border border-primary-subtle" 
                                      th:text="${t.typeTransaction}">LOCATION</span>
                            </td>
                            
                            <td class="text-center">
                                <div th:if="${t.dateFin != null}">
                                    <span th:if="${t.dateFin.isBefore(T(java.time.LocalDate).now())}" 
                                          class="status-badge bg-danger">
                                        <i class="bi bi-clock-history me-1"></i> Terminée
                                    </span>
                                    <span th:if="${!t.dateFin.isBefore(T(java.time.LocalDate).now())}" 
                                          class="status-badge bg-success">
                                        <i class="bi bi-play-circle me-1"></i> En cours
                                    </span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 pt-3 border-top">
                <a th:href="@{/utilisateurs/principal}" class="btn btn-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Retour au menu
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
