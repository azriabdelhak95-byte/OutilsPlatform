<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutilsPlatform - Connexion</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="card login-card text-center">
        <div class="card-body">
            <div class="brand-logo">🛠️</div>
            <h2 class="fw-bold mb-3">Connexion</h2>
            <p class="text-muted mb-4">Accédez à votre compte OutilsPlatform</p>

            <div th:if="${erreur}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
                <div th:text="${erreur}">Message d'erreur</div>
            </div>

            <form th:action="@{/utilisateurs/connexion}" method="post">
                <div class="form-floating mb-3 text-start">
                    <input type="email" class="form-control" id="email" name="email" placeholder="nom@exemple.com" required>
                    <label for="email">Adresse email</label>
                </div>

                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control" id="motDePasse" name="motDePasse" placeholder="Mot de passe" required>
                    <label for="motDePasse">Mot de passe</label>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">Se connecter</button>
                </div>
            </form>

            <div class="mt-4 border-top pt-3">
                <p class="small text-muted mb-1">Pas encore de compte ?</p>
                <a href="/utilisateurs/inscription" class="text-decoration-none fw-bold">Créer un compte</a>
            </div>
            
            <a href="/utilisateurs/accueil" class="btn btn-link btn-sm mt-3 text-secondary text-decoration-none">← Retour à l'accueil</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
