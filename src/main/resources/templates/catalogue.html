<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue - OutilsPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .card-outil { border: none; border-radius: 15px; transition: 0.3s; }
        .card-outil:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/utilisateurs/principal}">🛠️ OutilsPlatform</a>
            <ul class="navbar-nav ms-auto flex-row">
                <li class="nav-item me-3"><a class="nav-link" th:href="@{/outils/mes-outils}">Mes Outils</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transactions/mes-transactions}">Mes Locations</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="fw-bold mb-4">Outils disponibles à la location</h2>
        
        <div class="row g-4">
            <div class="col-md-4" th:each="outil : ${outils}">
                <div class="card card-outil h-100 p-3 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-info mb-2" 
                              th:text="${outil.categorie != null ? outil.categorie.nom : 'Bricolage'}">Bricolage</span>
                        
                        <h4 class="fw-bold" th:text="${outil.nom}">Nom de l'outil</h4>
                        
                        <p class="text-muted small">État : <span th:text="${outil.etat}">BON_ETAT</span></p>
                        
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <span class="text-muted small"><i class="bi bi-geo-alt"></i> Disponible</span>
                            
                            <a th:href="@{/transactions/louer/{id}(id=${outil.id})}" class="btn btn-primary rounded-pill px-4">
                                Réserver
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(outils)}" class="text-center py-5">
            <p class="lead text-muted">Aucun outil n'est encore disponible dans le catalogue.</p>
            <a th:href="@{/outils/ajouter}" class="btn btn-outline-primary">Ajouter le premier outil</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
